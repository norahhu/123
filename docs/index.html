  <main class="layout"><nav class="toc"><p>章节导航</p><div id="toc"></div></nav><article><label class="search">⌕ <input id="search" placeholder="搜索诊所、医生或项目" aria-label="搜索攻略内容"></label><div id="content"><p>正在载入完整攻略…</p></div></article></main>

  <script>
    const content=document.querySelector('#content'),toc=document.querySelector('#toc'),search=document.querySelector('#search');
    const clean=t=>t.replace(/\[\[#?([^\]]+)\]\]/g,'$1').replace(/\[\[([^\]]+)\]\]/g,'$1').trim();
    const inline=t=>clean(t).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    const id=t=>clean(t).replace(/[\[\]#]/g,'').replace(/\s+/g,'-');
    const guideFiles=['00','01','02','03','04','05','06','07'].map(n=>`data/guide-${n}`);
    Promise.all(guideFiles.map(f=>fetch(f).then(r=>r.text()))).then(async parts=>{const b=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));const s=new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'));return new Response(s).text()}).then(md=>{let html='',nav='';for(const raw of md.split('\n')){const l=raw.trim();if(!l)continue;if(l==='---'){html+='<hr>';continue}let m=l.match(/^(#{1,4})\s+(.+)$/);if(m){const n=m[1].length,t=clean(m[2]),anchor=id(t);if(n===1)html+=`<div class="doc-title"><p>GUIDEBOOK</p><h2>${t}</h2></div>`;else if(n===2){html+=`<h2 class="chapter" id="${anchor}">${t}</h2>`;nav+=`<a href="#${anchor}">${t.replace(/^[一二三四]、/,'')}</a>`}else html+=`<h${n} id="${anchor}">${t}</h${n}>`;continue}if(l.startsWith('>')){html+=`<blockquote>${inline(l.slice(1))}</blockquote>`;continue}m=l.match(/^[-*]\s+(.+)$/);if(m){html+=`<p class="bullet"><span>•</span>${inline(m[1])}</p>`;continue}m=l.match(/^\d+[.)、]\s+(.+)$/);html+=m?`<p>${inline(m[1])}</p>`:`<p>${inline(l)}</p>`}content.innerHTML=html;toc.innerHTML=nav;}).catch(()=>content.innerHTML='<p>内容加载失败，请稍后刷新重试。</p>');
    search.addEventListener('input',()=>{const q=search.value.trim().toLowerCase();document.querySelectorAll('#content p,#content h2,#content h3,#content h4,#content blockquote').forEach(el=>el.classList.toggle('hidden',!!q&&!el.textContent.toLowerCase().includes(q)))});
    async function copy(){await navigator.clipboard.writeText(location.href);document.querySelectorAll('#copy,#copy-bottom').forEach(b=>{b.textContent='链接已复制';setTimeout(()=>b.textContent=b.id==='copy'?'复制分享链接':'转发给朋友 ↗',1800)})}document.querySelector('#copy').onclick=copy;document.querySelector('#copy-bottom').onclick=copy;
  </script>
